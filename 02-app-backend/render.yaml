services:
  - type: web
    name: cova-backend
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COVA_MODE
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
